<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LZ — Be First</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#080808;font-family:Arial,sans-serif}
.wrap{min-height:100vh;display:grid;place-items:center;padding:40px}.box{width:min(720px,100%)}
.kicker{font-size:10px;letter-spacing:.28em;text-transform:uppercase;text-align:center;margin-bottom:20px}
h1{font-family:Georgia,serif;font-size:clamp(72px,14vw,150px);font-weight:400;letter-spacing:-.06em;line-height:.8;margin:0;text-align:center}
.sub{text-align:center;color:#777;margin:36px 0 58px;font-size:14px}
form{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid #111}
input{border:0;background:transparent;padding:14px 0;outline:none;font-size:12px;letter-spacing:.08em}
button{border:0;background:transparent;font-size:10px;font-weight:700;cursor:pointer;padding:0 0 0 20px}
#msg{text-align:center;font-size:12px;color:#666;min-height:18px;margin-top:14px}
.privacy{text-align:center;color:#999;font-size:10px;line-height:1.5;margin-top:28px}
</style>
</head>
<body><main class="wrap"><section class="box">
<div class="kicker">Private Access</div><h1>BE FIRST.</h1>
<p class="sub">Novos drops, reposições e lançamentos. Sem spam.</p>
<form id="newsletter"><input id="email" type="email" required placeholder="SEU EMAIL"><button>ENTRAR NA LISTA ↗</button></form>
<div id="msg"></div>
<p class="privacy">Ao entrar, você aceita receber novidades da LZ. Todo e-mail inclui opção de descadastro.</p>
</section></main>
<script>
const form=document.querySelector('#newsletter'), msg=document.querySelector('#msg');
form.addEventListener('submit',async e=>{
 e.preventDefault(); const email=document.querySelector('#email').value.trim();
 msg.textContent='ENTRANDO...';
 try{
  const r=await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error||'Erro');
  msg.textContent='Cadastro confirmado. Você receberá os próximos lançamentos.'; form.reset();
 }catch(err){msg.textContent=err.message||'Não foi possível cadastrar agora.'}
});
</script></body></html>
